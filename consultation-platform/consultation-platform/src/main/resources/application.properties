# Application Configuration
spring.application.name=consultation-platform
server.port=8080

# MySQL Database Configuration (Supports both Docker and Local IntelliJ)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/consultation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.expirationMs=86400000

# OpenRouter / LLM Configuration
openrouter.api.key=${OPENROUTER_API_KEY:}